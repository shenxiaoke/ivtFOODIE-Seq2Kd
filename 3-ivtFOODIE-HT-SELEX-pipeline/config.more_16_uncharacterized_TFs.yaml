preprocessing:
  threads_per_sample: 8
  qualified_quality_phred: 20
  unqualified_percent_limit: 40
  n_base_limit: 2
  length_required: 40
  adapter_r1: AGATCGGAAGAGCACACGTCTGAACTCCAGTCA
  adapter_r2: AGATCGGAAGAGCGTCGTGTAGGGAAAGAGTGT

extraction:
  mode: paired_consensus
  random_region_length: 40
  start_1based: 1
  primer_5: ""
  primer_3: ""
  max_pair_mismatches: 2
  minimum_quality_delta_at_mismatch: 1

counting:
  sort_memory: 8G
  sort_threads: 8

enrichment:
  pseudocount: 1.0
  include_adjacent_round_comparisons: true

motif:
  final_round: cycle4
  background_round: cycle0
  sample_seed: 20260916
  streme_max_sequences_per_round: 100000
  hts_ibis_max_sequences_per_round: 1000000
  hts_ibis_scan_pvalue: 0.0001
  min_width: 6
  max_width: 15
  number_of_motifs: 10
  hts_ibis_java_memory: 48G

software:
  hts_ibis_jar: software/HTS-IBIS/HTS-IBIS.jar
  hts_ibis_source: https://acgt.cs.tau.ac.il/hts-ibis/HTS-IBIS.zip
